{% extends 'base.html' %}
{% load static %}

{% block title %}Cursos - Bioparque Macuco{% endblock %}

{% block content %}
<section class="cursos cursos--page" id="cursos">
  <div class="cursos__container">
    <h2 class="section-title section-title--green-text">CURSOS DISPONÍVEIS</h2>

    <div class="cursos__grid" id="courses-grid" data-empty-message="Nenhum curso disponível no momento.">

{% block extra_js %}

{% endblock %}
